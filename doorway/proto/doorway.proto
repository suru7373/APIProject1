syntax = "proto3";

package doorway;

service DoorwayService {
  rpc GetMessage (Empty) returns (DataResponse);
  rpc CreateEmployee (CreateDataRequest) returns (DataResponse);
}

message CreateDataRequest {
  string name = 1;
  string email = 2;
}

message Empty {}

message Employee {
  int32 id = 1;
  string name = 2;
  string email = 3;
}

message DataResponse {
  string message = 1;
  repeated Employee data = 2;
}